[project]
name = "harmonica-jianpu-backend"
version = "0.1.0"
description = "Backend for Harmonica Jianpu"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "music21>=9.1.0",
  "pypdf>=4.3.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
